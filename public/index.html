<!DOCTYPE html>
<html>
<head>
  <title>Test Server</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
    .connected { background: #d4edda; color: #155724; }
    .disconnected { background: #f8d7da; color: #721c24; }
    textarea { width: 100%; height: 100px; margin: 10px 0; padding: 10px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 5px; white-space: pre-wrap; }
    .loading { color: #666; }
  </style>
</head>
<body>
  <h1>🧪 Railway Test Server</h1>
  
  <div id="status" class="status disconnected">
    Checking connection...
  </div>
  
  <h2>Send Prompt to DeepSeek</h2>
  <textarea id="message" placeholder="Enter your prompt here...">Write a short poem about coding</textarea>
  <br>
  <button id="sendBtn" onclick="sendPrompt()">Send to DeepSeek</button>
  
  <div id="result"></div>
  
  <script>
    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const statusEl = document.getElementById('status');
        
        if (data.connected) {
          statusEl.textContent = '✅ Extension Connected';
          statusEl.className = 'status connected';
        } else {
          statusEl.textContent = '❌ Extension Not Connected';
          statusEl.className = 'status disconnected';
        }
      } catch (err) {
        console.error('Status check failed:', err);
      }
    }
    
    async function sendPrompt() {
      const message = document.getElementById('message').value;
      const btn = document.getElementById('sendBtn');
      const resultEl = document.getElementById('result');
      
      if (!message.trim()) {
        alert('Please enter a message');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = 'Sending...';
      resultEl.innerHTML = '<span class="loading">⏳ Waiting for DeepSeek response...</span>';
      
      try {
        const res = await fetch('/api/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        
        const data = await res.json();
        
        if (data.success) {
          resultEl.innerHTML = '<strong>✅ Result:</strong><br><br>' + data.result;
        } else {
          resultEl.innerHTML = '<strong>❌ Error:</strong><br><br>' + data.error;
        }
      } catch (err) {
        resultEl.innerHTML = '<strong>❌ Error:</strong><br><br>' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send to DeepSeek';
      }
    }
    
    // Check status every 3 seconds
    checkStatus();
    setInterval(checkStatus, 3000);
  </script>
</body>
</html>
